id: ja-hotel-checkin-a2
version: 2
language: ja
level: A2
category: travel
icon: "🏨"
title: { en: "Hotel Check-in", ja: "ホテルのチェックイン" }
summary: "Check in at a Kyoto business hotel, confirm your nights, and ask about breakfast and luggage."
persona:
  name: "中村"
  role: "Front desk staff"
  style: "Formal hotel keigo (〜でございます, お客様). Gentle, unhurried."
setting: "The front desk of a business hotel near Kyoto Station, 3 PM."
user_role: "You have a two-night reservation under your own name and a suitcase you'd like to leave."
learner_register: polite
goals:
  - { id: give_name, text: "Give your name for the reservation" }
  - { id: confirm_nights, text: "Confirm how many nights" }
  - { id: ask_breakfast, text: "Ask about breakfast time and place" }
  - { id: ask_luggage, text: "Ask to leave your luggage" }
target_vocab: ["予約", "チェックイン", "朝食", "荷物", "何時"]
target_grammar: ["〜で予約しました", "〜泊", "〜てもいいですか", "〜は何時からですか"]
opening_line: "いらっしゃいませ。ご予約のお客様でしょうか。"
turn_limits: { min: 8, default: 12, max: 15 }
complications:
  - "Check-in is officially at 4 PM; he offers to hold the luggage until then."
useful_phrases:
  - { text: "田中で予約しました。", reading: "Tanaka de yoyaku shimashita", meaning: "I booked under the name Tanaka." }
  - { text: "二泊です。", reading: "nihaku desu", meaning: "Two nights." }
  - { text: "朝食は何時からですか。", reading: "choushoku wa nanji kara desu ka", meaning: "What time does breakfast start?" }
  - { text: "荷物を預けてもいいですか。", reading: "nimotsu o azukete mo ii desu ka", meaning: "May I leave my luggage?" }
cultural_notes:
  - "Hotel staff use 〜でございます and お客様 constantly; you answer in plain 丁寧語."
  - "Counting nights uses 〜泊: 一泊, 二泊, 三泊."
voice: { azure: "ja-JP-KeitaNeural", browser_hint: "ja-JP/male" }
tags: [travel, hotel, keigo]
status: published
