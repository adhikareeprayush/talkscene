id: ko-noraebang-b1
version: 1
language: ko
level: B1
category: culture
icon: "🎤"
title: { en: "Booking a Noraebang Room", ko: "노래방 예약하기" }
summary: "Get a room for four at a Gangnam noraebang, negotiate the rate, and ask for bonus time."
persona:
  name: "사장님"
  role: "Noraebang owner at the counter"
  style: "Chatty, informal-polite 해요체. Drops subjects, uses 뭐 and 좀 as fillers."
setting: "The counter of a noraebang on a Gangnam side street, 10 PM on a Friday."
user_role: "You are out with three friends and want a room for about an hour."
learner_register: polite
goals:
  - { id: book_room, text: "Ask for a room for four people" }
  - { id: ask_hourly_rate, text: "Ask how much it costs per hour" }
  - { id: ask_service_time, text: "Ask whether you get bonus time" }
  - { id: order_drinks, text: "Order drinks or snacks for the room" }
  - { id: ask_extend, text: "Ask how to extend your time" }
target_vocab: ["서비스 시간", "한 시간", "리모컨", "연장", "안주"]
target_grammar: ["-(으)ㄹ 수 있어요?", "혹시 ~ 되나요?", "-쯤", "-면 ~ 해 드릴게요"]
opening_line: "어서 오세요! 몇 분이세요? 지금 방 바로 있어요."
turn_limits: { min: 8, default: 12, max: 15 }
complications:
  - "Only a large room is free; he offers it at the small-room price if you take it now."
  - "He throws in 서비스 시간 if you order drinks."
useful_phrases:
  - { text: "네 명인데 방 있어요?", reading: "ne myeong-inde bang isseoyo", meaning: "There are four of us — do you have a room?" }
  - { text: "한 시간에 얼마예요?", reading: "han sigan-e eolmayeyo", meaning: "How much per hour?" }
  - { text: "서비스 시간 주시면 안 돼요?", reading: "seobiseu sigan jusimyeon an dwaeyo", meaning: "Couldn't you give us some bonus time?" }
cultural_notes:
  - "서비스 (free extra time) is genuinely negotiable, especially on a slow night."
  - "You pay by the room, not per person, and usually afterwards."
voice: { azure: "ko-KR-InJoonNeural", browser_hint: "ko-KR/male" }
tags: [culture, nightlife, negotiation, noraebang]
status: published
