  /v1/sessions/{session_id}/turns:
    post:
      tags:
      - sessions
      summary: Submit a learner turn (text or audio) and stream the reply
      description: 'Send `{"text": ...}` as JSON, or `audio` plus optional `client_transcript` as `multipart/form-data`.
        The response is always `text/event-stream` with these events:


        | event | meaning |

        |---|---|

        | `transcript` | final server-side transcription, with word timings |

        | `no_speech` | nothing usable was heard; **the turn was not counted** |

        | `ai_delta` | a chunk of the reply text |

        | `ai_audio` | a synthesized sentence is ready at `url` |

        | `ai_replace` | the reply was regenerated (language lock) — replace the text so far |

        | `meta` | goal progress, translation, romanization, suggested replies |

        | `turn_state` | turn budget and whether the conversation ended |

        | `error` | an RFC 9457 problem document; the stream then ends |

        | `done` | end of stream |'
      operationId: submit_turn_v1_sessions__session_id__turns_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
