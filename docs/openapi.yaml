openapi: 3.1.0
info:
  title: TalkScene API
  description: "\nScenario-based language-learning API for **Korean, Japanese, German and English**.\n\
    \nPick a scenario, hold a 10–15 turn roleplay in voice or text, then get a report on\ngrammar, vocabulary,\
    \ fluency and pronunciation.\n\n**Conventions**\n\n* `Authorization: Bearer <JWT>` on everything except\
    \ the catalog and `/v1/status`.\n  `POST /v1/auth/guest` issues an anonymous token immediately.\n\
    * Errors are [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) `application/problem+json`\n  with\
    \ a stable `code` field.\n* `POST /v1/sessions/{id}/turns` answers with `text/event-stream`; every\
    \ other\n  endpoint is JSON.\n* Rate limits appear as `429` with a `Retry-After` header; quota exhaustion\
    \ as `429`\n  with `code: quota-exceeded`.\n* Provider degradation is reported, never hidden — poll\
    \ `GET /v1/status` for the banner.\n"
  version: 0.4.0
servers:
- url: http://localhost:8000
  description: dev
